[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-translator"
version = "0.1.0"
description = "Translate public static web pages into reviewed offline Korean HTML bundles."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<0.29",
    "httpcore>=1.0,<1.1",
    "beautifulsoup4",
    "lxml",
    "tinycss2",
    "langdetect",
    "playwright",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-httpx",
]

[project.scripts]
web-translator = "web_translator.cli:console_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
